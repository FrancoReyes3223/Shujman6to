# .github/workflows/deploy.yml
#
# Se activa con push directo a master o cuando se mergea un PR a master.
# Compila frontend (Next.js static), docs (Astro) y backend (TypeScript),
# luego sube los artefactos al servidor de la facu via SCP.
#
# Secretos que tenés que configurar en GitHub → Settings → Secrets and variables → Actions:
#   SERVER_HOST    → 200.3.127.46
#   SERVER_USER    → tu usuario (ej: siete)
#   SERVER_SSH_KEY → contenido de tu clave privada SSH (~/.ssh/id_rsa o id_ed25519)
# Puerto SSH del servidor: 22002

name: Deploy SchujmanB2B

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
    types: [closed]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Para PRs, solo corre si fue mergeado (no si se cerró sin mergear)
    if: github.event_name == 'push' || github.event.pull_request.merged == true

    steps:
      # 1. Clonar el repositorio
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar Node.js 20 (LTS)
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 3. Instalar dependencias de docs y compilar (Astro → docs/dist/)
      - name: Instalar dependencias de docs
        run: npm ci --prefix docs

      - name: Compilar docs
        run: npm run build --prefix docs

      # 4. Copiar docs compilados a frontend/public/docs/
      - name: Copiar docs al frontend
        run: node scripts/copy-docs.mjs

      # 5. Instalar dependencias del frontend y compilar (Next.js → frontend/out/)
      #    USUARIO se usa para el basePath (/~usuario) en next.config.ts
      - name: Instalar dependencias del frontend
        run: npm ci --prefix frontend

      - name: Compilar frontend
        run: npm run build --prefix frontend
        env:
          USUARIO: ${{ secrets.SERVER_USER }}

      # 6. Instalar dependencias del backend y compilar (TypeScript → backend/dist/)
      - name: Instalar dependencias del backend
        run: npm ci --prefix backend

      - name: Compilar backend
        run: npm run build --prefix backend

      # 7. Subir frontend (out/) a ~/public_html/ en el servidor
      - name: Subir frontend al servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: 22002
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "frontend/out/"
          target: "~/public_html/"
          strip_components: 2   # elimina "frontend/out/" del path destino

      # 8. Subir backend compilado (dist/) a ~/servicios/dist/
      - name: Subir backend dist al servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: 22002
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "backend/dist/"
          target: "~/servicios/dist/"
          strip_components: 2

      # 9. Subir schema y migraciones de Prisma a ~/servicios/prisma/
      - name: Subir prisma al servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: 22002
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "backend/prisma/"
          target: "~/servicios/prisma/"
          strip_components: 2

      # 10. (Opcional) Reiniciar el backend en el servidor
      #     Descomentá si el backend corre como proceso persistente (pm2, systemd, etc.)
      # - name: Reiniciar backend
      #   uses: appleboy/ssh-action@v1.0.3
      #   with:
      #     host: ${{ secrets.SERVER_HOST }}
      #     port: 22002
      #     username: ${{ secrets.SERVER_USER }}
      #     key: ${{ secrets.SERVER_SSH_KEY }}
      #     script: |
      #       cd ~/servicios
      #       pm2 restart backend || node dist/index.js &
      #       echo "Backend reiniciado"

      - name: Deploy completado
        run: |
          echo "Sitio:  http://${{ secrets.SERVER_HOST }}:8002/~${{ secrets.SERVER_USER }}/"
          echo "API:    http://${{ secrets.SERVER_HOST }}:8002/~${{ secrets.SERVER_USER }}/api/"
          echo "Docs:   http://${{ secrets.SERVER_HOST }}:8002/~${{ secrets.SERVER_USER }}/docs/"
